uv:
    candy:
        description: |
            Provides the uv Python package manager (astral-sh/uv) as standalone uv + uvx binaries
            Downloads the latest astral-sh/uv release tarball and extracts the
            two standalone Rust binaries (uv, uvx) directly into /usr/local/bin.
            The release nests them under an arch dir, so strip_components: 1
            lands them flat. Verifiable because both binaries must be present
            and `uv --version` must run cleanly once the candy is applied — a
            no-op candy would leave /usr/local/bin/uv absent.
        plan:
            - run: download=https://github.com/astral-sh/uv/releases/latest/download/uv-${BUILD_ARCH}-unknown-linux-gnu.tar.gz
              download: "https://github.com/astral-sh/uv/releases/latest/download/uv-${BUILD_ARCH}-unknown-linux-gnu.tar.gz"
              extract: tar.gz
              strip_components: 1
              to: /usr/local/bin
              run_as: root
              # Explicit uninstall list so `charly deploy del` removes just the
              # binaries this archive drops in /usr/local/bin, not the whole
              # shared dir (which would wipe every system-local binary).
              uninstall:
                - /usr/local/bin/uv
                - /usr/local/bin/uvx
            - check: the uv binary is installed at /usr/local/bin/uv
              file:
                file: /usr/local/bin/uv
                exists: true
            - check: uv reports its version and exits successfully
              exit_status: 0
              command: /usr/local/bin/uv --version
            - check: the uvx tool-runner is installed at /usr/local/bin/uvx
              file:
                file: /usr/local/bin/uvx
                exists: true

uv-skill:
    skill:
        name: uv
        family: coder
        owner: uv
        description: |-
            uv + uvx — Astral's fast Python package/project manager. Installs as a
            direct-download binary (no pixi env, no Python dep). Pulled via the
            `download:` verb with `strip_components: 1` to handle the upstream
            tarball's arch-prefixed top-level directory.
            Use when working with the uv candy or when deciding whether to install a
            CLI tool via pixi vs. direct binary download.
